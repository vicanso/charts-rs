# git-cliff configuration
# https://git-cliff.org/docs/configuration
# Regenerate with `make changelog`.

[changelog]
header = """
# Changelog

Generated by `make changelog`.
Moving from 1.x to 2.0: [docs/migrating-2.0.md](./docs/migrating-2.0.md).
Moving from 0.7 to 1.0: [docs/migrating-1.0.md](./docs/migrating-1.0.md).

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group in ["Breaking changes", "Added", "Changed", "Fixed", "Performance", "Documentation"] -%}
    {%- set matched = commits | filter(attribute="group", value=group) -%}
    {%- if matched | length > 0 %}
    ### {{ group }}
    {% for commit in matched %}
        - {{ commit.message | split(pat="\n") | first | trim | upper_first }} \
          ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/vicanso/charts-rs/commit/{{ commit.id }}))
    {%- endfor %}
    {% endif -%}
{% endfor %}

"""
footer = """

{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/vicanso/charts-rs/compare/{{ release.previous.version }}..{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/vicanso/charts-rs/tree/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [Unreleased]: https://github.com/vicanso/charts-rs/compare/{{ release.previous.version }}..HEAD
    {% endif %}
{% endfor -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat!", group = "Breaking changes" },
    { message = "^refactor!", group = "Breaking changes" },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    # The changelog itself is no change to the library.
    { message = "^docs: update changelog", skip = true },
    { message = "^docs", group = "Documentation" },
    { message = "^chore", skip = true },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
]
filter_commits = false
commit_preprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/vicanso/charts-rs/issues/${1}))" },
]
topo_order = false
sort_commits = "newest"
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
link_parsers = [
    { pattern = "#(\\d+)", href = "https://github.com/vicanso/charts-rs/issues/$1" },
]
