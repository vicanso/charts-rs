name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        toolchain: [1.88.0, 1.89.0, 1.90.0, stable]
        # Cross-platform coverage on stable only, to keep the matrix small.
        include:
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable

    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/setup-nasm@v1
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
        components: rustfmt, clippy
    - name: Check format
      if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
      run: cargo fmt --all --check
    - name: Clippy
      if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
      run: cargo clippy --features=image-encoder --all-targets --all -- --deny=warnings
    - name: Clippy (default features)
      if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
      run: cargo clippy --no-default-features --all-targets --all -- --deny=warnings
    - name: Build
      run: cargo build --verbose
    # Raster export renders with resvg + system fonts, which are platform
    # dependent, and AVIF needs nasm; keep the image-encoder run on Linux only.
    - name: Run tests (image-encoder)
      if: matrix.os == 'ubuntu-latest'
      run: cargo test --verbose --features "image-encoder"
    # The SVG output is deterministic, so run it on every platform.
    - name: Run tests (default features)
      run: cargo test --verbose --no-default-features

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Security audit
      uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
